<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>乡村驾驶 · Countryside</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { touch-action: manipulation; }
  body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial,'Microsoft YaHei',sans-serif; }
  #ui { position:absolute; top:10px; left:10px; z-index:10; background:rgba(22,26,32,0.5); padding:6px 12px; border-radius:8px; color:#eef3f8; border:1px solid rgba(255,255,255,0.15); backdrop-filter:blur(4px); pointer-events:none; }
  #score { font-size:16px; font-weight:600; line-height:1.1; }
  #speed { font-size:12px; color:#8fc3ff; margin-top:2px; line-height:1.1; }
  #info { font-size:11px; margin-top:3px; font-weight:600; color:#b5e06a; line-height:1.1; }
  #toast { position:absolute; top:22%; left:50%; transform:translateX(-50%); z-index:12; font-size:30px; font-weight:700; color:#ff4444; text-shadow:0 2px 12px rgba(0,0,0,0.7); opacity:0; transition:opacity 0.3s; pointer-events:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(10,14,20,0.72); z-index:20; color:#fff; text-align:center; }
  #overlay h1 { font-size:44px; font-weight:700; letter-spacing:2px; margin-bottom:8px; }
  #overlay h2 { font-size:18px; color:#8fd66a; margin-bottom:22px; letter-spacing:1px; font-weight:400; }
  #overlay p { font-size:15px; color:#c2ccd6; margin:5px; }
  #overlay button { margin-top:22px; padding:13px 44px; font-family:inherit; font-size:18px; letter-spacing:2px; color:#fff; background:#3ea53e; border:none; border-radius:8px; cursor:pointer; box-shadow:0 4px 16px rgba(62,165,62,0.5); transition:0.15s; }
  #overlay button:hover { background:#2f8a2f; transform:translateY(-1px); }
  .hidden { display:none !important; }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:5; background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.32) 100%); }
  #flash { position:absolute; inset:0; background:#ffffff; opacity:0; pointer-events:none; z-index:6; }
  .vbtn { position:relative; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.45); color:#fff; font-family:inherit; font-size:22px; border-radius:12px; display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none; touch-action:none; cursor:pointer; backdrop-filter:blur(3px); }
  .vbtn.active { background:rgba(62,165,62,0.6); border-color:#9ce37a; }
  #dpad { position:fixed; left:18px; bottom:20px; z-index:15; display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,58px); gap:8px; }
  #btnUp { grid-column:2; grid-row:1; }
  #btnLeft { grid-column:1; grid-row:2; }
  #btnDown { grid-column:2; grid-row:2; }
  #btnRight { grid-column:3; grid-row:2; }
  #actions { position:fixed; right:18px; bottom:20px; z-index:15; display:flex; flex-direction:column; gap:10px; align-items:center; }
  #btnSpace { width:96px; height:48px; font-size:16px; border-radius:24px; }
  #btnC { width:64px; height:48px; font-size:18px; border-radius:24px; }
  #btnCar { width:96px; height:48px; font-size:16px; border-radius:24px; background:rgba(120,200,100,0.22); border-color:rgba(150,220,130,0.6); }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="flash"></div>
<div id="toast"></div>

<div id="dpad">
  <button class="vbtn" id="btnUp">▲</button>
  <button class="vbtn" id="btnLeft">◀</button>
  <button class="vbtn" id="btnDown">▼</button>
  <button class="vbtn" id="btnRight">▶</button>
</div>
<div id="actions">
  <button class="vbtn" id="btnCar">换车</button>
  <button class="vbtn" id="btnC">C</button>
  <button class="vbtn" id="btnSpace">刹车</button>
</div>

<div id="ui" class="hidden">
  <div id="score">得分 0</div>
  <div id="speed">速度 0 KM/H</div>
  <div id="info">乡村公路 · 注意对向来车</div>
</div>
<div id="overlay">
  <h1>乡村驾驶</h1>
  <h2>Countryside Driving</h2>
  <p>按 ↑ 或屏幕 ▲ 加速启动</p>
  <p>← → 变道/借道 &nbsp;|&nbsp; ↑ 加速 &nbsp;|&nbsp; ↓ 减速 &nbsp;|&nbsp; 空格 刹车 &nbsp;|&nbsp; C 视角 &nbsp;|&nbsp; 换车</p>
  <p>乡村公路弯道多，注意对向来车，安全驾驶</p>
  <button id="startBtn">开始驾驶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer;
let car, carGroup;
let aiCars = [];
let oncomingCars = [];
let treeList = [];
let paddyList = [];
let farmerList = [];
let houseList = [];
let riverList = [];
let camList = [];
let egretList = [];
let birdList = [];
let groundLines = [];
let rainLines, rainDrops = [];
let splash, splashData = [];
let sunnyGroup;
let spotLight, spotTarget;
let lightningLight;
let weather = 'sunny';
let clock;
let gameState = 'menu';
let score = 0;
let speed = 0;
let targetSpeed = 0;
let minSpeed = 0.0;
let playerX = 1.75;
let targetX = 1.75;
let roadWidth = 8;
let aiSpawnTimer = 0;
let oncomingTimer = 0;
let splashTimer = 0;
let lightningTimer = 7;
let camMode = 0;
let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let animTime = 0;
let keys = {};

const MIN_X = -1.75;
const MAX_X = 1.75;
const CAR_TYPES = ['mini','tesla','xiaomi','porsche','audi'];
let carTypeIndex = 0;

const CURVE_AMP = 3.2, CURVE_FREQ = 0.006;
function curveAt(z) { return CURVE_AMP * Math.sin(z * CURVE_FREQ); }

const logoCache = {};
function getCarLogo(type) {
  if (logoCache[type]) return logoCache[type];
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const ctx = c.getContext('2d');
  ctx.clearRect(0,0,128,128);
  if (type === 'mini') { ctx.beginPath(); ctx.arc(64,64,58,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); ctx.beginPath(); ctx.arc(64,64,48,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.fillStyle='#111'; ctx.font='bold 44px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MINI',64,68); }
  else if (type === 'tesla') { ctx.strokeStyle='#e31937'; ctx.lineWidth=10; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(64,70,42,-Math.PI*0.85,-Math.PI*0.15); ctx.stroke(); ctx.beginPath(); ctx.moveTo(64,28); ctx.lineTo(64,100); ctx.stroke(); }
  else if (type === 'xiaomi') { ctx.fillStyle='#ff6900'; ctx.fillRect(16,20,96,88); ctx.fillStyle='#fff'; ctx.font='bold 46px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MI',64,66); }
  else if (type === 'porsche') { ctx.beginPath(); ctx.moveTo(64,10); ctx.lineTo(112,34); ctx.lineTo(112,74); ctx.quadraticCurveTo(64,120,64,120); ctx.quadraticCurveTo(64,120,16,74); ctx.lineTo(16,34); ctx.closePath(); ctx.fillStyle='#d4af37'; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle='#8a6d1f'; ctx.stroke(); ctx.fillStyle='#8a6d1f'; ctx.font='bold 30px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('POR',64,60); }
  else { ctx.strokeStyle='#d8d8d8'; ctx.lineWidth=8; for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(26+i*26,64,16,0,Math.PI*2); ctx.stroke(); } }
  const tex = new THREE.CanvasTexture(c); logoCache[type]=tex; return tex;
}
function getMaxSpeed() { return 2.8 + Math.min(2.2, score * 0.00045); }
function setWeather(type) {
  weather = type;
  if (type === 'sunny') { scene.background = new THREE.Color(0x8fd0f0); scene.fog = new THREE.Fog(0xc6e6f5, 120, 320); if (rainLines) rainLines.visible = false; if (sunnyGroup) sunnyGroup.visible = true; lightningLight.intensity = 0; }
  else { scene.background = new THREE.Color(0x9bb0c4); scene.fog = new THREE.Fog(0xb8c8d6, 60, 210); if (rainLines) rainLines.visible = true; if (sunnyGroup) sunnyGroup.visible = false; }
}
function randomWeather() { setWeather(Math.random() < 0.55 ? 'sunny' : 'rainy'); }
function pressMove(dir) { if (gameState !== 'playing') return; if (dir === 'left') { targetX -= 3.5; } else { targetX += 3.5; } targetX = Math.max(MIN_X, Math.min(MAX_X, targetX)); }
function toggleCam() { camMode = (camMode + 1) % 3; }

function init() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fd0f0); scene.fog = new THREE.Fog(0xc6e6f5, 120, 320);
  camera = new THREE.PerspectiveCamera(68, window.innerWidth/window.innerHeight, 0.1, 1000); camera.position.set(1.5, 5, 11); camera.lookAt(1.75, 1, -14);
  renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();
  buildLights(); buildGround(); buildHills(); buildRoadside(); buildFarField(); buildRivers(); buildCams(); buildEgrets(); buildBirds(); buildCar(); buildRain(); buildSplash(); buildSkyDecor();
  [groundLines, treeList, paddyList, farmerList, houseList, riverList, camList].forEach(arr=>{ arr.forEach(o=>{ if(!o.userData) o.userData={}; o.userData.bx = o.position.x; }); });
  randomWeather();
  window.addEventListener('resize', onResize); window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKeyUp);
  document.getElementById('startBtn').addEventListener('click', startGame); bindVirtualButtons();
  document.getElementById('overlay').classList.add('hidden'); document.getElementById('ui').classList.remove('hidden');
  gameState = 'playing'; initAudio(); animate();
}
function bindHold(btn, key) { if (!btn) return; btn.addEventListener('pointerdown', e => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); }); const up = e => { keys[key] = false; btn.classList.remove('active'); }; btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up); }
function bindTap(btn, fn) { if (!btn) return; btn.addEventListener('pointerdown', e => { e.preventDefault(); fn(); btn.classList.add('active'); }); btn.addEventListener('pointerup', e => { btn.classList.remove('active'); }); btn.addEventListener('pointerleave', e => { btn.classList.remove('active'); }); }
function bindVirtualButtons() { bindHold(document.getElementById('btnUp'), 'arrowup'); bindHold(document.getElementById('btnDown'), 'arrowdown'); bindHold(document.getElementById('btnSpace'), ' '); bindTap(document.getElementById('btnLeft'), () => pressMove('left')); bindTap(document.getElementById('btnRight'), () => pressMove('right')); bindTap(document.getElementById('btnC'), () => toggleCam()); bindTap(document.getElementById('btnCar'), () => switchCar()); }

function buildLights() { scene.add(new THREE.HemisphereLight(0xffffff, 0x6a7a55, 0.95)); const sun = new THREE.DirectionalLight(0xfff2d0, 1.1); sun.position.set(30, 60, 20); scene.add(sun); const fill = new THREE.DirectionalLight(0xbcd4ee, 0.3); fill.position.set(-30, 30, -30); scene.add(fill); lightningLight = new THREE.PointLight(0xffffff, 0, 300); lightningLight.position.set(0, 60, -20); scene.add(lightningLight); }

function buildGround() {
  const roadMat = new THREE.MeshStandardMaterial({ color:0x4a4c50, roughness:0.95, metalness:0.05 });
  const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 540), roadMat); road.rotation.x = -Math.PI/2; road.position.set(0, 0, -180); scene.add(road);
  const grassMat = new THREE.MeshStandardMaterial({ color:0x5f8a3e, roughness:1 });
  [-1,1].forEach(side=>{ const g = new THREE.Mesh(new THREE.PlaneGeometry(420, 540), grassMat); g.rotation.x = -Math.PI/2; g.position.set(side*(14 + 210), -0.02, -180); scene.add(g); });
  const shoulderMat = new THREE.MeshStandardMaterial({ color:0x9a8a5a, roughness:1 });
  [-1,1].forEach(side=>{ const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 540), shoulderMat); sh.rotation.x = -Math.PI/2; sh.position.set(side*7.5, 0.005, -180); scene.add(sh); });
  const lineMat = new THREE.MeshStandardMaterial({ color:0xf0efe4, roughness:0.6 });
  for (let i=0; i<70; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 3.2), lineMat); m.position.set(0, 0.03, -i*8); scene.add(m); groundLines.push(m); }
}
function makeRoundTree() { const g=new THREE.Group(); const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,2.2,8), new THREE.MeshStandardMaterial({color:0x7a5a38,roughness:0.95})); trunk.position.y=1.1; g.add(trunk); const leafColors=[0x3f8a3a,0x4a9a44,0x2f7a34,0x5aaa4a]; const leafMat=new THREE.MeshStandardMaterial({color:leafColors[Math.floor(Math.random()*leafColors.length)],roughness:1}); const c1=new THREE.Mesh(new THREE.IcosahedronGeometry(1.6,0),leafMat); c1.position.y=3.2; g.add(c1); const c2=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,0),leafMat); c2.position.set(0.7,3.9,0.3); g.add(c2); const c3=new THREE.Mesh(new THREE.IcosahedronGeometry(1.0,0),leafMat); c3.position.set(-0.7,3.7,-0.3); g.add(c3); return g; }
function makeOsmanthusTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.34,2.4,8), new THREE.MeshStandardMaterial({color:0x6a4a2e,roughness:0.95})); trunk.position.y = 1.2; g.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({ color:0x2f6a2e, roughness:1 });
  const c0 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8,0), leafMat); c0.position.y = 3.4; g.add(c0);
  const c1 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3,0), leafMat); c1.position.set(0.9,3.9,0.4); g.add(c1);
  const c2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,0), leafMat); c2.position.set(-0.85,3.8,-0.35); g.add(c2);
  const c3 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,0), leafMat); c3.position.set(0.1,4.4,-0.6); g.add(c3);
  const flowerMat = new THREE.MeshStandardMaterial({ color:0xffcf3a, emissive:0x3a2a00, emissiveIntensity:0.3, roughness:0.6 });
  for (let i=0; i<14; i++) { const fl = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), flowerMat); const a = Math.random()*Math.PI*2, rr = 1.0 + Math.random()*1.3; fl.position.set(Math.cos(a)*rr, 3.2 + Math.random()*1.4, Math.sin(a)*rr); g.add(fl); }
  return g;
}
function buildRoadside() {
  [-1,1].forEach(side=>{
    for (let i=0; i<28; i++) {
      const t = Math.random() < 0.55 ? makeOsmanthusTree() : makeRoundTree();
      t.position.set(side*(9 + Math.random()*8), 0, -i*21 - Math.random()*9);
      t.rotation.y = Math.random()*Math.PI*2;
      t.userData = { period: 600 };
      scene.add(t); treeList.push(t);
    }
  });
}

function makePaddyTexture() { const c=document.createElement('canvas'); c.width=128; c.height=128; const ctx=c.getContext('2d'); ctx.fillStyle='#6a9a3a'; ctx.fillRect(0,0,128,128); ctx.strokeStyle='#4a6a2a'; ctx.lineWidth=6; for(let i=0;i<=128;i+=32){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,128); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(128,i); ctx.stroke(); } ctx.fillStyle='#8ab84a'; for(let x=8;x<128;x+=16) for(let y=8;y<128;y+=16){ ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill(); } const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; return tex; }
function makeRicePaddy(size) { const g=new THREE.Group(); const t=makePaddyTexture(); t.repeat.set(2,2); const mat=new THREE.MeshStandardMaterial({map:t,roughness:1}); const p=new THREE.Mesh(new THREE.PlaneGeometry(size,size),mat); p.rotation.x=-Math.PI/2; p.position.y=0.03; g.add(p); return g; }
function makeFarmer() { const g=new THREE.Group(); const skin=new THREE.MeshStandardMaterial({color:0xd8b89a,roughness:0.8}); const clothColors=[0x3a5a8a,0x8a3a3a,0x4a6a3a,0x6a5a3a,0x5a4a7a]; const cloth=new THREE.MeshStandardMaterial({color:clothColors[Math.floor(Math.random()*clothColors.length)],roughness:0.9}); const pants=new THREE.MeshStandardMaterial({color:0x33404f,roughness:0.9}); const hatMat=new THREE.MeshStandardMaterial({color:0xd8c88a,roughness:0.9}); const legGeo=new THREE.CylinderGeometry(0.07,0.08,0.62,7); const legL=new THREE.Mesh(legGeo,pants); legL.position.set(-0.1,0.31,0); g.add(legL); const legR=new THREE.Mesh(legGeo,pants); legR.position.set(0.1,0.31,0); g.add(legR); const torso=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.2,0.6,10),cloth); torso.position.set(0,0.85,0.15); torso.rotation.x=0.6; g.add(torso); const armGeo=new THREE.CylinderGeometry(0.05,0.05,0.45,7); const armL=new THREE.Mesh(armGeo,cloth); armL.position.set(-0.2,0.8,0.35); armL.rotation.x=0.9; g.add(armL); const armR=new THREE.Mesh(armGeo,cloth); armR.position.set(0.2,0.8,0.35); armR.rotation.x=0.9; g.add(armR); const head=new THREE.Mesh(new THREE.SphereGeometry(0.15,10,10),skin); head.position.set(0,1.05,0.35); g.add(head); const brim=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.36,0.05,14),hatMat); brim.position.set(0,1.18,0.35); g.add(brim); const top=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,0.16,12),hatMat); top.position.set(0,1.27,0.35); g.add(top); return g; }

// 徽派建筑
function makeHuizhouHouse() {
  const g = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color:0xf2eee4, roughness:0.9 });
  const tileMat = new THREE.MeshStandardMaterial({ color:0x2b2b30, roughness:0.8 });
  const w = 6 + Math.random()*2, h = 3.6 + Math.random()*1.4, d = 7 + Math.random()*2;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat); wall.position.y = h/2; g.add(wall);
  const roofL = new THREE.Mesh(new THREE.BoxGeometry(w/2+0.5, 0.25, d+0.7), tileMat); roofL.position.set(-w/4, h+0.6, 0); roofL.rotation.z = 0.42; g.add(roofL);
  const roofR = new THREE.Mesh(new THREE.BoxGeometry(w/2+0.5, 0.25, d+0.7), tileMat); roofR.position.set(w/4, h+0.6, 0); roofR.rotation.z = -0.42; g.add(roofR);
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.34, d+0.75), tileMat); ridge.position.set(0, h+1.15, 0); g.add(ridge);
  [-1,1].forEach(sx=>{
    for (let k=0; k<3; k++) {
      const stepH = h + 1.0 + (k===1?0.7:0);
      const step = new THREE.Mesh(new THREE.BoxGeometry(0.36, stepH, d*0.3), wallMat);
      step.position.set(sx*(w/2 - 0.05), stepH/2, (k-1)*d*0.28); g.add(step);
      const cap = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.16, d*0.3+0.05), tileMat);
      cap.position.set(sx*(w/2 - 0.05), stepH, (k-1)*d*0.28); g.add(cap);
    }
  });
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.8, 0.08), new THREE.MeshStandardMaterial({color:0x3a2a1a,roughness:0.8})); door.position.set(0, 0.9, d/2+0.02); g.add(door);
  const winMat = new THREE.MeshStandardMaterial({color:0x2a2a30,roughness:0.6});
  [-1.6, 1.6].forEach(sx=>{ const win = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.08), winMat); win.position.set(sx, h*0.62, d/2+0.02); g.add(win); });
  return g;
}

function buildFarField() {
  [-1,1].forEach(side=>{
    for (let i=0; i<18; i++) {
      const pd = makeRicePaddy(22);
      pd.position.set(side*(28 + Math.random()*10), 0, -i*34 - Math.random()*12);
      pd.userData = { period: 620 }; scene.add(pd); paddyList.push(pd);
      const nf = 1 + Math.floor(Math.random()*2);
      for (let k=0;k<nf;k++) { const f=makeFarmer(); f.position.set(side*(28 + Math.random()*9), 0, pd.position.z + (Math.random()-0.5)*10); f.rotation.y=Math.random()*Math.PI*2; f.userData={period:620}; scene.add(f); farmerList.push(f); }
    }
  });
  for (let i=0; i<46; i++) { const side=Math.random()<0.5?-1:1; const pd=makeRicePaddy(30+Math.random()*8); pd.position.set(side*(48+Math.random()*110),0,-Math.random()*460); pd.userData={period:600}; scene.add(pd); paddyList.push(pd); }
  // 徽派民居（更多：近处路旁 + 远处）
  for (let i=0; i<36; i++) { const side=Math.random()<0.5?-1:1; const hs=makeHuizhouHouse(); const near = Math.random()<0.5; hs.position.set(side*(near?(18+Math.random()*14):(45+Math.random()*75)),0,-Math.random()*460); hs.rotation.y = (side<0?0:Math.PI) + (Math.random()-0.5)*0.3; hs.userData={period:600}; scene.add(hs); houseList.push(hs); }
}
function buildHills() { const greens=[0x5a7a44,0x4a6a3a,0x6a8a4a,0x7a8a4a]; for(let i=0;i<20;i++){ const side=Math.random()<0.5?-1:1; const r=35+Math.random()*55; const hillMat=new THREE.MeshStandardMaterial({color:greens[Math.floor(greens.length*Math.random())],roughness:1}); const hill=new THREE.Mesh(new THREE.SphereGeometry(r,16,12,0,Math.PI*2,0,Math.PI/2),hillMat); hill.scale.y=0.35+Math.random()*0.3; hill.position.set(side*(120+Math.random()*120),-1,-80-Math.random()*400); scene.add(hill); } }

// 远处河流 + 桥
function makeRiverBridge() {
  const g = new THREE.Group();
  const waterMat = new THREE.MeshStandardMaterial({ color:0x2f6f9f, roughness:0.2, metalness:0.5, transparent:true, opacity:0.92 });
  const water = new THREE.Mesh(new THREE.PlaneGeometry(16, 200), waterMat); water.rotation.x = -Math.PI/2; water.position.y = 0.04; g.add(water);
  // 桥面（沿 x 横跨河）
  const deckMat = new THREE.MeshStandardMaterial({ color:0xa8a49a, roughness:0.85 });
  const deck = new THREE.Mesh(new THREE.BoxGeometry(30, 0.5, 6), deckMat); deck.position.y = 1.6; g.add(deck);
  const railMat = new THREE.MeshStandardMaterial({ color:0xd8d4c8, roughness:0.7 });
  [-2.8, 2.8].forEach(dz=>{
    const rail = new THREE.Mesh(new THREE.BoxGeometry(30, 0.5, 0.15), railMat); rail.position.set(0, 2.1, dz); g.add(rail);
  });
  const pierMat = new THREE.MeshStandardMaterial({ color:0x8a857a, roughness:0.9 });
  [-9, 9].forEach(dx=>{ const pier = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 5.5), pierMat); pier.position.set(dx, 0.8, 0); g.add(pier); });
  return g;
}
function buildRivers() {
  for (let i=0; i<6; i++) {
    const side = (i%2===0)?1:-1;
    const rb = makeRiverBridge();
    rb.position.set(side*(95 + Math.random()*45), 0, -i*260 - 80);
    rb.userData = { period: 1600 };
    scene.add(rb); riverList.push(rb);
  }
}

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,6.4,10), mat); pole.position.y = 3.2; g.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(2.6,0.12,0.12), mat); arm.position.set(-1.3, 6.3, 0); g.add(arm);

  const lightMat = new THREE.MeshBasicMaterial({ color:0x333333 });

function buildCams() {
  for (let i=0; i<4; i++) {

function camFlash(c) {

  const wingR = new THREE.Group(); const wr = new THREE.Mesh(new THREE.BoxGeometry(0.95,0.04,0.5), white); wr.position.x=0.48; wingR.add(wr); wingR.position.set(0.15,0.1,0); g.add(wingR);

}
function makeBird() {

  const mat = new THREE.MeshStandardMaterial({ color:0x2a2a30, roughness:0.8, fog:false });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), mat); body.scale.set(1,0.8,1.8); g.add(body);

function buildEgrets() {
  for (let i=0; i<3; i++) {
    const e = makeEgret();
    const dir = Math.random() < 0.5 ? 1 : -1;
    e.position.set((Math.random()-0.5)*120, 16 + Math.random()*8, -30 - Math.random()*60);
    e.rotation.y = dir > 0 ? -Math.PI/2 : Math.PI/2;
    e.userData.vx = dir * (6 + Math.random()*4);
    e.userData.flap = Math.random()*6;
    scene.add(e); egretList.push(e);
  }
}
function buildBirds() {
  const groupY = 20 + Math.random()*6, groupZ = -50 - Math.random()*30;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const baseX = (Math.random()-0.5)*80;
  for (let i=0; i<6; i++) {
    const b = makeBird();
    b.position.set(baseX + i*1.8 - 4, groupY + (Math.random()-0.5)*3, groupZ + (Math.random()-0.5)*6);
    b.rotation.y = dir > 0 ? -Math.PI/2 : Math.PI/2;
    b.userData.vx = dir * (9 + Math.random()*3);
    b.userData.flap = Math.random()*6;
    scene.add(b); birdList.push(b);
  }
}
function updateFlyers(list, dt) {
  for (let i=0; i<list.length; i++) {
    const e = list[i];
    e.position.x += e.userData.vx * dt;
    e.userData.flap += dt * 10;
    const w = Math.sin(e.userData.flap) * 0.6;
    e.userData.wingL.rotation.z = w;
    e.userData.wingR.rotation.z = -w;
    if (e.position.x > 80) e.position.x = -80;
    if (e.position.x < -80) e.position.x = 80;
  }
}

function buildRain() { const rainCount=850; const geo=new THREE.BufferGeometry(); const pos=new Float32Array(rainCount*6); rainDrops=[]; for(let i=0;i<rainCount;i++){ const x=(Math.random()-0.5)*60,y=Math.random()*45,z=(Math.random()-0.5)*110; rainDrops.push({x,y,z,sp:38+Math.random()*30}); pos[i*6]=x;pos[i*6+1]=y;pos[i*6+2]=z;pos[i*6+3]=x-0.3;pos[i*6+4]=y-1.1;pos[i*6+5]=z; } geo.setAttribute('position', new THREE.BufferAttribute(pos,3)); rainLines=new THREE.LineSegments(geo, new THREE.LineBasicMaterial({color:0xdfe8f0,transparent:true,opacity:0.32})); scene.add(rainLines); }
function buildSplash() { const N=90,geo=new THREE.BufferGeometry(),pos=new Float32Array(N*3); splashData=[]; for(let i=0;i<N;i++){ pos[i*3]=0;pos[i*3+1]=-999;pos[i*3+2]=0; splashData.push({life:0,x:0,y:-999,z:0,vx:0,vy:0,vz:0}); } geo.setAttribute('position', new THREE.BufferAttribute(pos,3)); splash=new THREE.Points(geo, new THREE.PointsMaterial({color:0xdfe8f0,size:0.16,transparent:true,opacity:0.7})); splash.frustumCulled=false; scene.add(splash); }

function updateSplash(dt) { const arr=splash.geometry.attributes.position.array; for(let i=0;i<splashData.length;i++){ const d=splashData[i]; if(d.life>0){ d.life-=dt; d.vy-=6*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.z+=d.vz*dt; if(d.life<=0||d.y<0){d.life=0;d.y=-999;} } arr[i*3]=d.x;arr[i*3+1]=d.y;arr[i*3+2]=d.z; } splash.geometry.attributes.position.needsUpdate=true; }

function spawnAICar() {
  const lane = 1.75; const r = Math.random(); let v;
  if (r < 0.06) { v = makePoliceCar(); v.userData.ownSpeed = 0.4 + Math.random()*0.2; }
  else if (r < 0.12) { v = makeSchoolBus(); v.userData.ownSpeed = 0.22 + Math.random()*0.1; }
  else if (r < 0.18) { v = makeAmbulance(); v.userData.ownSpeed = 0.3 + Math.random()*0.12; }
  else if (r < 0.30) { const busColors=[0xd94f4f,0x2f6df6,0x2fa86a,0xe0a83a,0xeeeeee]; v = makeBus(busColors[Math.floor(Math.random()*busColors.length)]); v.userData={w:2.4,d:8,ownSpeed:0.22+Math.random()*0.12}; }
  else { const palette=[0xffffff,0x1a1a1d,0x9aa0a6,0x8a1f1f,0x1e3a6e,0x2f5d3a,0xd8d8d8,0x333a44]; v = makeSedan(palette[Math.floor(Math.random()*palette.length)]); v.userData={w:1.4,d:2.8,ownSpeed:0.3+Math.random()*0.35}; }
  v.position.set(lane + curveAt(-125), 0, -125); scene.add(v); aiCars.push(v);
}
function spawnOncomingCar() {
  const lane = -1.75; const isBus = Math.random() < 0.12; let v;
  if (isBus) { v = makeBus(0xdddddd); v.userData={w:2.4,d:8}; } else { const palette=[0xffffff,0x1a1a1d,0x9aa0a6,0x8a1f1f,0x1e3a6e,0xd8d8d8]; v = makeSedan(palette[Math.floor(Math.random()*palette.length)]); v.userData={w:1.4,d:2.8}; }
  v.rotation.y = Math.PI; v.position.set(lane + curveAt(-125), 0, -125); v.userData.ownSpeed = 0.3 + Math.random()*0.3; v.userData.laneX = lane; scene.add(v); oncomingCars.push(v);
}
function onKey(e) { const k=e.key.toLowerCase(); if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault(); keys[k]=true; if (k==='c'){ toggleCam(); } if (gameState!=='playing') return; if (k==='arrowleft'||k==='a') pressMove('left'); if (k==='arrowright'||k==='d') pressMove('right'); }
function onKeyUp(e) { keys[e.key.toLowerCase()] = false; }
function onResize() { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
function initAudio() { try { if (audioCtx){ if(audioCtx.state==='suspended')audioCtx.resume(); return; } audioCtx=new (window.AudioContext||window.webkitAudioContext)(); engineOsc=audioCtx.createOscillator(); engineGain=audioCtx.createGain(); engineOsc.type='sawtooth'; engineOsc.frequency.value=60; engineGain.gain.value=0.03; engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc.start(); } catch(e){} }
function playBeep(freq,dur,type){ if(!audioCtx)return; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.frequency.value=freq; o.type=type||'square'; g.gain.value=0.08; o.connect(g); g.connect(audioCtx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur); o.stop(audioCtx.currentTime+dur); }
function playThunder(){ if(!audioCtx)return; const dur=1.8,bs=Math.floor(audioCtx.sampleRate*dur); const buffer=audioCtx.createBuffer(1,bs,audioCtx.sampleRate); const data=buffer.getChannelData(0); for(let i=0;i<bs;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/bs,2); const src=audioCtx.createBufferSource(); src.buffer=buffer; const filter=audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=380; const g=audioCtx.createGain(); g.gain.value=0.2; src.connect(filter); filter.connect(g); g.connect(audioCtx.destination); src.start(); }
function triggerLightning(){ const flash=document.getElementById('flash'); flash.style.background='#ffffff'; flash.style.transition='none'; flash.style.opacity='0.7'; lightningLight.intensity=5; setTimeout(()=>{ flash.style.transition='opacity 0.12s'; flash.style.opacity='0'; lightningLight.intensity=0;},70); setTimeout(()=>{ flash.style.transition='none'; flash.style.opacity='0.4'; lightningLight.intensity=3;},150); setTimeout(()=>{ flash.style.transition='opacity 0.35s'; flash.style.opacity='0'; lightningLight.intensity=0;},210); setTimeout(()=>{ if(audioCtx)playThunder(); },260+Math.random()*400); }
function showToast(text,color){ const t=document.getElementById('toast'); t.textContent=text; t.style.color=color||'#ff4444'; t.style.opacity='1'; clearTimeout(t._t); t._t=setTimeout(()=>{ t.style.opacity='0'; },900); }
function animate() { requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05); animTime+=dt; if(gameState==='playing') updateGame(dt); updateCamera(dt); updateEnvironment(dt); updateFlyers(egretList, dt); updateFlyers(birdList, dt); updateRain(dt); updateSplash(dt); renderer.render(scene, camera); }
function updateCamera(dt) { const sm=Math.min(1,dt*5); const cy=curveAt(6); carGroup.visible=(camMode!==1); if(camMode===0){ if(Math.abs(camera.fov-68)>0.1){camera.fov=68;camera.updateProjectionMatrix();} camera.position.x+=((playerX*0.85+cy)-camera.position.x)*sm; camera.position.y+=(5-camera.position.y)*sm; camera.position.z+=(11-camera.position.z)*sm; camera.lookAt(playerX*0.9+cy,1.0,-14); } else if(camMode===1){ if(Math.abs(camera.fov-82)>0.1){camera.fov=82;camera.updateProjectionMatrix();} camera.position.set(playerX+cy,1.15,5.9); camera.lookAt(playerX+cy,1.0,-25); } else { if(Math.abs(camera.fov-68)>0.1){camera.fov=68;camera.updateProjectionMatrix();} camera.position.set(playerX+cy,2.1,1.4); camera.lookAt(playerX+cy,1.4,26); } }
function applyLaneFollowing(arr, baseRelFn) { for(let a of arr) a.userData._rel=baseRelFn(a); for(let i=0;i<arr.length;i++){ const a=arr[i]; let leader=null,minDz=Infinity; for(let j=0;j<arr.length;j++){ if(i===j)continue; const b=arr[j]; if(Math.abs(a.position.x-b.position.x)>1.6)continue; const dz=b.position.z-a.position.z; if(dz>0&&dz<minDz){minDz=dz;leader=b;} } if(leader){ const gap=a.userData.d/2+leader.userData.d/2+3; if(minDz<gap && a.userData._rel>leader.userData._rel) a.userData._rel=leader.userData._rel; } } }

function updateGame(dt) {
  const curMax=getMaxSpeed();
  if(keys['arrowup']||keys['w']) targetSpeed += dt*1.6;
  if(keys['arrowdown']||keys['s']) targetSpeed -= dt*1.6;
  if(keys[' ']) targetSpeed=0;
  targetSpeed=Math.max(minSpeed,Math.min(curMax,targetSpeed));
  if(keys[' ']){ speed += (0-speed)*Math.min(1,dt*9); if(speed<0.02)speed=0; } else { speed += (targetSpeed-speed)*Math.min(1,dt*3); if(speed<0.02)speed=0; }
  score += speed*0.6;
  document.getElementById('score').textContent = '得分 ' + Math.floor(score);
  document.getElementById('speed').textContent = '速度 ' + Math.floor(speed*110) + ' KM/H';
  playerX += (targetX-playerX)*Math.min(1,dt*10);
  car.position.x = playerX + curveAt(6);
  car.rotation.z = (targetX-playerX)*-0.08;
  if(engineOsc) engineOsc.frequency.value = 50 + speed*40;
  aiSpawnTimer -= dt*60*Math.max(speed,0.4);
  if(aiSpawnTimer<=0){ spawnAICar(); aiSpawnTimer = 130 + Math.random()*90 - Math.min(40, score*0.01); }
  applyLaneFollowing(aiCars, a => (speed - a.userData.ownSpeed)*60);
  for(let i=aiCars.length-1;i>=0;i--){
    const a=aiCars[i]; a.position.z += a.userData._rel*dt; a.position.x = 1.75 + curveAt(a.position.z);
    const dx=Math.abs(a.position.x-car.position.x), dz=Math.abs(a.position.z-car.position.z);
    if(dx<(a.userData.w/2+car.userData.w/2) && dz<(a.userData.d/2+car.userData.d/2)){ gameOver('发生碰撞','撞上车了'); return; }
    if(a.position.z>24 || a.position.z<-180){ scene.remove(a); aiCars.splice(i,1); }
  }
  oncomingTimer -= dt*60*Math.max(speed,0.4);
  if(oncomingTimer<=0){ spawnOncomingCar(); oncomingTimer = 150 + Math.random()*100; }
  applyLaneFollowing(oncomingCars, a => (speed + a.userData.ownSpeed)*60);
  for(let i=oncomingCars.length-1;i>=0;i--){
    const o=oncomingCars[i]; o.position.z += o.userData._rel*dt; o.position.x = -1.75 + curveAt(o.position.z);
    const dx=Math.abs(o.position.x-car.position.x), dz=Math.abs(o.position.z-car.position.z);
    if(dx<(o.userData.w/2+car.userData.w/2) && dz<(o.userData.d/2+car.userData.d/2)){ gameOver('发生碰撞','撞上对向车辆'); return; }
    if(o.position.z>24 || o.position.z<-180){ scene.remove(o); oncomingCars.splice(i,1); }
  }
  if(speed>0.5){ splashTimer-=dt; if(splashTimer<=0){ emitSplash(); splashTimer=0.05; } }
  if(weather==='rainy'){ lightningTimer-=dt; if(lightningTimer<=0){ triggerLightning(); lightningTimer=6+Math.random()*10; } }
}

function updateEnvironment(dt) {
  const spd = gameState==='playing'?speed:0.3; const moveZ = spd*60*dt;
  groundLines.forEach(m=>{ m.position.z += moveZ; if(m.position.z>15) m.position.z -= 8*70; m.position.x = m.userData.bx + curveAt(m.position.z); });
  treeList.forEach(t=>{ t.position.z += moveZ; if(t.position.z>60) t.position.z -= t.userData.period; t.position.x = t.userData.bx + curveAt(t.position.z); });
  paddyList.forEach(p=>{ p.position.z += moveZ; if(p.position.z>100) p.position.z -= 620; p.position.x = p.userData.bx + curveAt(p.position.z); });
  farmerList.forEach(p=>{ p.position.z += moveZ; if(p.position.z>100) p.position.z -= p.userData.period; p.position.x = p.userData.bx + curveAt(p.position.z); });
  houseList.forEach(h=>{ h.position.z += moveZ; if(h.position.z>100) h.position.z -= 600; h.position.x = h.userData.bx + curveAt(h.position.z); });
  riverList.forEach(r=>{ r.position.z += moveZ; if(r.position.z>120) r.position.z -= r.userData.period; r.position.x = r.userData.bx + curveAt(r.position.z); });
  camList.forEach(c=>{
    const curZ = c.position.z + moveZ;
    if(c.userData.prevZ > 6 && curZ <= 6 && !c.userData.judged){ c.userData.judged = true; camFlash(c); }
    c.userData.prevZ = curZ; c.position.z = curZ;
    c.position.x = c.userData.bx + curveAt(curZ);
    if(c.position.z > 60){ c.position.z -= c.userData.period; c.userData.judged = false; c.userData.prevZ = c.position.z; }
  });
}
function updateRain(dt) { if(!rainLines||weather!=='rainy')return; const arr=rainLines.geometry.attributes.position.array; const fast=gameState==='playing'?(1+speed*1.3):1; const slant=-0.3*fast; for(let i=0;i<rainDrops.length;i++){ const d=rainDrops[i]; d.y-=d.sp*dt*fast; if(d.y<0){ d.y=42+Math.random()*8; d.x=(Math.random()-0.5)*60; d.z=(Math.random()-0.5)*110; } arr[i*6]=d.x;arr[i*6+1]=d.y;arr[i*6+2]=d.z;arr[i*6+3]=d.x+slant;arr[i*6+4]=d.y-1.1;arr[i*6+5]=d.z; } rainLines.geometry.attributes.position.needsUpdate=true; rainLines.position.x = car.position.x*0.8; }

function gameOver(reason, detail) { if(gameState==='menu')return; gameState='menu'; if(engineGain)engineGain.gain.value=0; playBeep(120,0.5); const fl=document.getElementById('flash'); fl.style.background='#ff2222'; fl.style.transition='none'; fl.style.opacity='0.5'; setTimeout(()=>{ fl.style.transition='opacity 0.5s'; fl.style.opacity='0'; },100); const overlay=document.getElementById('overlay'); overlay.classList.remove('hidden'); overlay.innerHTML = `
    <h1 style="color:#ff4d4d;">驾驶结束</h1>
    <h2 style="color:#ffb0b0;">${reason}</h2>
    <p>${detail||''}</p>
    <p>本次得分：${Math.floor(score)} 分</p>
    <button id="restartBtn">再开一次</button>
  `; document.getElementById('restartBtn').addEventListener('click', restart); }
function restart() {
  aiCars.forEach(a=>scene.remove(a)); aiCars=[];
  oncomingCars.forEach(a=>scene.remove(a)); oncomingCars=[];
  score=0; speed=0; targetSpeed=0; playerX=1.75; targetX=1.75; car.position.x=1.75+curveAt(6); car.rotation.z=0; carGroup.visible=true;
  aiSpawnTimer=40; oncomingTimer=60; lightningTimer=5; splashTimer=0; camera.position.set(1.5,5,11);
  camList.forEach(c=>{ c.userData.judged=false; });
  randomWeather();
  document.getElementById('score').textContent='得分 0'; document.getElementById('speed').textContent='速度 0 KM/H';
  document.getElementById('overlay').classList.add('hidden'); document.getElementById('ui').classList.remove('hidden');
  gameState='playing'; initAudio(); if(engineGain)engineGain.gain.value=0.03;
}
function startGame() { document.getElementById('overlay').classList.add('hidden'); document.getElementById('ui').classList.remove('hidden'); gameState='playing'; initAudio(); }

init();
</script>
