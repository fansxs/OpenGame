  #signal { font-size:11px; margin-top:3px; font-weight:600; line-height:1.1; }
  #toast { position:absolute; top:22%; left:50%; transform:translateX(-50%); z-index:12; font-size:30px; font-weight:700; color:#ff4444; text-shadow:0 2px 12px rgba(0,0,0,0.7); opacity:0; transition:opacity 0.3s; pointer-events:none; }

  #overlay button:hover { background:#1e57d6; transform:translateY(-1px); }
  .hidden { display:none !important; }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:5; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%); }
  #flash { position:absolute; inset:0; background:#ffffff; opacity:0; pointer-events:none; z-index:6; }
  .vbtn { position:relative; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.45); color:#fff; font-family:inherit; font-size:22px; border-radius:12px; display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none; touch-action:none; cursor:pointer; backdrop-filter:blur(3px); }

  #btnUp { grid-column:2; grid-row:1; }
  #btnLeft { grid-column:1; grid-row:2; }
  #btnDown { grid-column:2; grid-row:2; }
  #btnRight { grid-column:3; grid-row:2; }
  #actions { position:fixed; right:18px; bottom:20px; z-index:15; display:flex; flex-direction:column; gap:10px; align-items:center; }
  #btnSpace { width:96px; height:48px; font-size:16px; border-radius:24px; }
  #btnC { width:64px; height:48px; font-size:18px; border-radius:24px; }
  #btnCar { width:96px; height:48px; font-size:16px; border-radius:24px; background:rgba(255,120,180,0.22); border-color:rgba(255,150,200,0.6); }

<body>
<div id="vignette"></div>
<div id="flash"></div>
<div id="toast"></div>

<div id="dpad">
  <button class="vbtn" id="btnUp">▲</button>
  <button class="vbtn" id="btnLeft">◀</button>
  <button class="vbtn" id="btnDown">▼</button>
  <button class="vbtn" id="btnRight">▶</button>
</div>
<div id="actions">
  <button class="vbtn" id="btnCar">换车</button>
  <button class="vbtn" id="btnC">C</button>
  <button class="vbtn" id="btnSpace">刹车</button>
</div>

<div id="ui" class="hidden">

  <div id="speed">速度 0 KM/H</div>
  <div id="signal">信号灯：-</div>

const brandCache = {};
function getBrandTexture(idx) {
  if (brandCache[idx]) return brandCache[idx];
  const b = BRANDS[idx];
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = b.bg; ctx.fillRect(0,0,512,128);
  ctx.fillStyle = b.tc;
  const len = b.text.length;
  let size = len <= 2 ? 96 : len <= 3 ? 76 : len <= 4 ? 58 : len <= 5 ? 48 : 40;
  ctx.font = 'bold ' + size + 'px Microsoft YaHei, Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.text, 256, 68);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4; brandCache[idx] = tex; return tex;
}
const logoCache = {};
function getCarLogo(type) {
  if (logoCache[type]) return logoCache[type];
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const ctx = c.getContext('2d');
  ctx.clearRect(0,0,128,128);
  if (type === 'mini') { ctx.beginPath(); ctx.arc(64,64,58,0,Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); ctx.beginPath(); ctx.arc(64,64,48,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.fillStyle='#111'; ctx.font='bold 44px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MINI',64,68); }
  else if (type === 'tesla') { ctx.strokeStyle='#e31937'; ctx.lineWidth=10; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(64,70,42,-Math.PI*0.85,-Math.PI*0.15); ctx.stroke(); ctx.beginPath(); ctx.moveTo(64,28); ctx.lineTo(64,100); ctx.stroke(); }
  else if (type === 'xiaomi') { ctx.fillStyle='#ff6900'; ctx.fillRect(16,20,96,88); ctx.fillStyle='#fff'; ctx.font='bold 46px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('MI',64,66); }
  else if (type === 'porsche') { ctx.beginPath(); ctx.moveTo(64,10); ctx.lineTo(112,34); ctx.lineTo(112,74); ctx.quadraticCurveTo(64,120,64,120); ctx.quadraticCurveTo(64,120,16,74); ctx.lineTo(16,34); ctx.closePath(); ctx.fillStyle='#d4af37'; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle='#8a6d1f'; ctx.stroke(); ctx.fillStyle='#8a6d1f'; ctx.font='bold 30px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('POR',64,60); }
  else { ctx.strokeStyle='#d8d8d8'; ctx.lineWidth=8; for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(26+i*26,64,16,0,Math.PI*2); ctx.stroke(); } }
  const tex = new THREE.CanvasTexture(c); logoCache[type]=tex; return tex;
}
function getMaxSpeed() { return 2.8 + Math.min(2.2, score * 0.00045); }
function setWeather(type) {
  weather = type;
  if (type === 'sunny') { scene.background = new THREE.Color(0x87ceeb); scene.fog = new THREE.Fog(0xbfe0f5, 100, 300); if (rainLines) rainLines.visible = false; if (sunnyGroup) sunnyGroup.visible = true; lightningLight.intensity = 0; }
  else { scene.background = new THREE.Color(0x9bb0c4); scene.fog = new THREE.Fog(0xb8c8d6, 55, 200); if (rainLines) rainLines.visible = true; if (sunnyGroup) sunnyGroup.visible = false; }
}
function randomWeather() { setWeather(Math.random() < 0.5 ? 'sunny' : 'rainy'); }
function pressMove(dir) { if (gameState !== 'playing') return; if (dir === 'left') { targetX -= 3.5; } else { targetX += 3.5; } targetX = Math.max(MIN_X, Math.min(MAX_X, targetX)); }
function toggleCam() { camMode = (camMode + 1) % 3; }

function init() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x87ceeb); scene.fog = new THREE.Fog(0xbfe0f5, 100, 300);
  camera = new THREE.PerspectiveCamera(68, window.innerWidth/window.innerHeight, 0.1, 1000); camera.position.set(1.5, 5, 11); camera.lookAt(1.75, 1, -14);
  renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();
  buildLights(); buildGround(); buildGroundMarks(); buildHills(); buildMedian(); buildCity(); buildFarField(); buildRoadside(); buildRoadSigns(); buildIntersections(); buildUTurns(); buildCar(); buildRain(); buildSplash(); buildSkyDecor();
  randomWeather();
  window.addEventListener('resize', onResize); window.addEventListener('keydown', onKey); window.addEventListener('keyup', onKeyUp);
  document.getElementById('startBtn').addEventListener('click', startGame); bindVirtualButtons();
  document.getElementById('overlay').classList.add('hidden'); document.getElementById('ui').classList.remove('hidden');
  gameState = 'playing'; initAudio(); animate();
}
function bindHold(btn, key) { if (!btn) return; btn.addEventListener('pointerdown', e => { e.preventDefault(); keys[key] = true; btn.classList.add('active'); }); const up = e => { keys[key] = false; btn.classList.remove('active'); }; btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up); }
function bindTap(btn, fn) { if (!btn) return; btn.addEventListener('pointerdown', e => { e.preventDefault(); fn(); btn.classList.add('active'); }); btn.addEventListener('pointerup', e => { btn.classList.remove('active'); }); btn.addEventListener('pointerleave', e => { btn.classList.remove('active'); }); }
function bindVirtualButtons() { bindHold(document.getElementById('btnUp'), 'arrowup'); bindHold(document.getElementById('btnDown'), 'arrowdown'); bindHold(document.getElementById('btnSpace'), ' '); bindTap(document.getElementById('btnLeft'), () => pressMove('left')); bindTap(document.getElementById('btnRight'), () => pressMove('right')); bindTap(document.getElementById('btnC'), () => toggleCam()); bindTap(document.getElementById('btnCar'), () => switchCar()); }

function buildLights() { scene.add(new THREE.HemisphereLight(0xffffff, 0x666a55, 0.9)); const sun = new THREE.DirectionalLight(0xfff2d0, 1.1); sun.position.set(30, 60, 20); scene.add(sun); const fill = new THREE.DirectionalLight(0xbcd4ee, 0.35); fill.position.set(-30, 30, -30); scene.add(fill); lightningLight = new THREE.PointLight(0xffffff, 0, 300); lightningLight.position.set(0, 60, -20); scene.add(lightningLight); }
function buildGround() {
  const roadMat = new THREE.MeshStandardMaterial({ color:0x3b3e45, roughness:0.95, metalness:0.05 }); const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, 520), roadMat); road.rotation.x = -Math.PI/2; road.position.set(0, 0, -170); scene.add(road);
  const walkMat = new THREE.MeshStandardMaterial({ color:0x9a9c9e, roughness:0.9 }); [-1,1].forEach(side=>{ const wk = new THREE.Mesh(new THREE.PlaneGeometry(4, 520), walkMat); wk.rotation.x = -Math.PI/2; wk.position.set(side*(roadWidth/2 + 2), 0.01, -170); scene.add(wk); });
  const grassMat = new THREE.MeshStandardMaterial({ color:0x516b3c, roughness:1 }); [-1,1].forEach(side=>{ const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 520), grassMat); g.rotation.x = -Math.PI/2; g.position.set(side*(roadWidth/2 + 205), -0.02, -170); scene.add(g); });
  const edgeMat = new THREE.MeshStandardMaterial({ color:0xf2f2ee, roughness:0.6 }); [-3.5, 3.5].forEach(lx=>{ for (let i=0; i<46; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.02, 2.6), edgeMat); m.position.set(lx, 0.03, -i*7); scene.add(m); groundLines.push(m); } });
  const eGeo = new THREE.BoxGeometry(0.18, 0.02, 520); const eL = new THREE.Mesh(eGeo, edgeMat); eL.position.set(-roadWidth/2 + 0.3, 0.03, -170); scene.add(eL); const eR = new THREE.Mesh(eGeo, edgeMat); eR.position.set(roadWidth/2 - 0.3, 0.03, -170); scene.add(eR);
  const railMat = new THREE.MeshStandardMaterial({ color:0xb8bcc0, roughness:0.5, metalness:0.7 }); [-1,1].forEach(side=>{ const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 520), railMat); rail.position.set(side*(roadWidth/2 + 0.15), 0.55, -170); scene.add(rail); const rail2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 520), railMat); rail2.position.set(side*(roadWidth/2 + 0.15), 0.9, -170); scene.add(rail2); });
}
function makeGroundTextTexture(text) { const c = document.createElement('canvas'); c.width = 512; c.height = 160; const ctx = c.getContext('2d'); ctx.clearRect(0,0,512,160); ctx.fillStyle = 'rgba(240,240,235,0.92)'; ctx.font = 'bold 110px Microsoft YaHei, Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 256, 84); return new THREE.CanvasTexture(c); }
function makeGroundArrowTexture(dir) { const c = document.createElement('canvas'); c.width = 128; c.height = 256; const ctx = c.getContext('2d'); ctx.clearRect(0,0,128,256); ctx.fillStyle = 'rgba(240,240,235,0.92)'; if (dir === 'straight') { ctx.fillRect(52, 60, 24, 150); ctx.beginPath(); ctx.moveTo(64,30); ctx.lineTo(20,90); ctx.lineTo(108,90); ctx.closePath(); ctx.fill(); } else if (dir === 'left') { ctx.fillRect(52, 100, 24, 110); ctx.fillRect(20, 100, 60, 24); ctx.beginPath(); ctx.moveTo(20,112); ctx.lineTo(60,80); ctx.lineTo(60,144); ctx.closePath(); ctx.fill(); } else { ctx.fillRect(52, 100, 24, 110); ctx.fillRect(48, 100, 60, 24); ctx.beginPath(); ctx.moveTo(108,112); ctx.lineTo(68,80); ctx.lineTo(68,144); ctx.closePath(); ctx.fill(); } return new THREE.CanvasTexture(c); }
function addGroundMark(texture, x, z, w, h) { const mat = new THREE.MeshBasicMaterial({ map: texture, transparent:true, depthWrite:false }); const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); p.rotation.x = -Math.PI/2; p.position.set(x, 0.06, z); scene.add(p); groundMarks.push(p); }
function buildGroundMarks() { const arrowTex = { straight: makeGroundArrowTexture('straight'), left: makeGroundArrowTexture('left'), right: makeGroundArrowTexture('right') }; for (let i=0; i<20; i++) { const lane = PLAYER_LANES[i % PLAYER_LANES.length]; const dirs = ['straight','straight','left','right']; const dir = dirs[Math.floor(Math.random()*dirs.length)]; addGroundMark(arrowTex[dir], lane, -i*30 - 10, 2.2, 4.4); } const txt1 = makeGroundTextTexture('礼让行人'); const txt2 = makeGroundTextTexture('公交站台'); const txt3 = makeGroundTextTexture('慢行'); for (let i=0; i<6; i++) { addGroundMark(i%2===0 ? txt1 : txt2, (i%2===0?1.75:5.25), -i*90 - 40, 6.5, 2.0); } addGroundMark(txt3, 1.75, -160, 5, 1.8); addGroundMark(txt3, 5.25, -300, 5, 1.8); }

function playBeep(freq, dur, type) { if (!audioCtx) return; const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.frequency.value = freq; o.type = type||'square'; g.gain.value = 0.08; o.connect(g); g.connect(audioCtx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur); o.stop(audioCtx.currentTime + dur); }
function playThunder() { if (!audioCtx) return; const dur = 1.8, bufferSize = Math.floor(audioCtx.sampleRate * dur); const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const data = buffer.getChannelData(0); for (let i=0; i<bufferSize; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2); const src = audioCtx.createBufferSource(); src.buffer = buffer; const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 380; const g = audioCtx.createGain(); g.gain.value = 0.2; src.connect(filter); filter.connect(g); g.connect(audioCtx.destination); src.start(); }
function triggerLightning() { const flash = document.getElementById('flash'); flash.style.background = '#ffffff'; flash.style.transition = 'none'; flash.style.opacity = '0.7'; lightningLight.intensity = 5; setTimeout(()=>{ flash.style.transition='opacity 0.12s'; flash.style.opacity='0'; lightningLight.intensity = 0; }, 70); setTimeout(()=>{ flash.style.transition='none'; flash.style.opacity='0.4'; lightningLight.intensity = 3; }, 150); setTimeout(()=>{ flash.style.transition='opacity 0.35s'; flash.style.opacity='0'; lightningLight.intensity = 0; }, 210); setTimeout(()=>{ if(audioCtx) playThunder(); }, 260 + Math.random()*400); }
function showToast(text, color) { const t = document.getElementById('toast'); t.textContent = text; t.style.color = color || '#ff4444'; t.style.opacity = '1'; clearTimeout(t._t); t._t = setTimeout(()=>{ t.style.opacity='0'; }, 900); }
function animate() { requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.05); animTime += dt; if (gameState === 'playing') updateGame(dt); updateCamera(dt); updateEnvironment(dt); updateSignals(dt); updateRain(dt); updateSplash(dt); renderer.render(scene, camera); }
function updateCamera(dt) { const sm = Math.min(1, dt*5); carGroup.visible = (camMode !== 1); if (camMode === 0) { if (Math.abs(camera.fov - 68) > 0.1) { camera.fov = 68; camera.updateProjectionMatrix(); } camera.position.x += (playerX*0.85 - camera.position.x)*sm; camera.position.y += (5 - camera.position.y)*sm; camera.position.z += (11 - camera.position.z)*sm; camera.lookAt(playerX*0.9, 1.0, -14); } else if (camMode === 1) { if (Math.abs(camera.fov - 82) > 0.1) { camera.fov = 82; camera.updateProjectionMatrix(); } camera.position.set(playerX, 1.15, 5.9); camera.lookAt(playerX, 1.0, -25); } else { if (Math.abs(camera.fov - 68) > 0.1) { camera.fov = 68; camera.updateProjectionMatrix(); } camera.position.set(playerX, 2.1, 1.4); camera.lookAt(playerX, 1.4, 26); } }
function applyLaneFollowing(arr, baseRelFn) { for (let a of arr) a.userData._rel = baseRelFn(a); for (let i=0; i<arr.length; i++) { const a = arr[i]; let leader = null, minDz = Infinity; for (let j=0; j<arr.length; j++) { if (i === j) continue; const b = arr[j]; if (Math.abs(a.position.x - b.position.x) > 1.6) continue; const dz = b.position.z - a.position.z; if (dz > 0 && dz < minDz) { minDz = dz; leader = b; } } if (leader) { const gap = a.userData.d/2 + leader.userData.d/2 + 3; if (minDz < gap && a.userData._rel > leader.userData._rel) a.userData._rel = leader.userData._rel; } } }

function updateGame(dt) {
  const curMax = getMaxSpeed();
  if (keys['arrowup'] || keys['w']) targetSpeed += dt * 1.6;
  if (keys['arrowdown'] || keys['s']) targetSpeed -= dt * 1.6;
  if (keys[' ']) targetSpeed = 0;
  targetSpeed = Math.max(minSpeed, Math.min(curMax, targetSpeed));
  if (keys[' ']) { speed += (0 - speed) * Math.min(1, dt*9); if (speed < 0.02) speed = 0; } else { speed += (targetSpeed - speed) * Math.min(1, dt*3); if (speed < 0.02) speed = 0; }
  score += speed * 0.6;
  document.getElementById('score').textContent = '得分 ' + Math.floor(score);
  document.getElementById('speed').textContent = '速度 ' + Math.floor(speed * 110) + ' KM/H';
  playerX += (targetX - playerX) * Math.min(1, dt*10);
  car.position.x = playerX; car.rotation.z = (targetX - playerX) * -0.08;
  if (engineOsc) engineOsc.frequency.value = 50 + speed*40;
  aiSpawnTimer -= dt * 60 * Math.max(speed, 0.4);
  if (aiSpawnTimer <= 0) { spawnAICar(); aiSpawnTimer = 45 + Math.random()*50 - Math.min(28, score*0.012); }
  applyLaneFollowing(aiCars, a => (speed - a.userData.ownSpeed) * 60);
  for (let i=aiCars.length-1; i>=0; i--) {
    const a = aiCars[i]; a.position.z += a.userData._rel * dt;
    const dx = Math.abs(a.position.x - car.position.x); const dz = Math.abs(a.position.z - car.position.z);
    if (dx < (a.userData.w/2 + car.userData.w/2) && dz < (a.userData.d/2 + car.userData.d/2)) { gameOver('发生碰撞', '撞上车了'); return; }
    if (a.position.z > 24 || a.position.z < -175) { scene.remove(a); aiCars.splice(i,1); }
  }
  oncomingTimer -= dt * 60 * Math.max(speed, 0.4);
  if (oncomingTimer <= 0) { spawnOncomingCar(); oncomingTimer = 60 + Math.random()*60; }
  applyLaneFollowing(oncomingCars, a => (speed + a.userData.ownSpeed) * 60);
  for (let i=oncomingCars.length-1; i>=0; i--) { const o = oncomingCars[i]; o.position.z += o.userData._rel * dt; if (o.position.z > 24 || o.position.z < -175) { scene.remove(o); oncomingCars.splice(i,1); } }
  if (speed > 0.5) { splashTimer -= dt; if (splashTimer <= 0) { emitSplash(); splashTimer = 0.05; } }
  if (weather === 'rainy') { lightningTimer -= dt; if (lightningTimer <= 0) { triggerLightning(); lightningTimer = 6 + Math.random()*10; } }
}

function updateSignals(dt) {
  signalTimer -= dt;
  if (signalTimer <= 0) { if (signalState === 'green') { signalState = 'yellow'; signalTimer = 1.8; } else if (signalState === 'yellow') { signalState = 'red'; signalTimer = 6; } else { signalState = 'green'; signalTimer = 8; } }
  const rOn = signalState === 'red' ? 0xff2222 : 0x330505; const yOn = signalState === 'yellow' ? 0xffcc00 : 0x333005; const gOn = signalState === 'green' ? 0x22ff44 : 0x053305;
  intersections.forEach(it => {
    it.userData.lights.forEach(L => { L.redMat.color.setHex(rOn); L.yelMat.color.setHex(yOn); L.grnMat.color.setHex(gOn); });
    it.userData.crossCars.forEach(cc => {
      const d = cc.userData;
      if (signalState === 'red') { cc.position.x += d.dir * d.sp * dt; const endX = -d.startX; if (d.dir > 0 && cc.position.x > endX) cc.position.x = d.startX; if (d.dir < 0 && cc.position.x < endX) cc.position.x = d.startX; }
      else { cc.position.x += (d.startX - cc.position.x) * Math.min(1, dt*2.2); }
      // 横向车与玩家碰撞检测
      if (gameState === 'playing') {
        const ccX = cc.position.x;
        const ccZ = it.position.z + cc.position.z;
        const dx = Math.abs(ccX - car.position.x);
        const dz = Math.abs(ccZ - car.position.z);
        if (dx < 1.9 && dz < 1.9) { gameOver('发生碰撞', '被横向车辆撞到'); }
      }
    });
  });
  const el = document.getElementById('signal');
  if (el) { if (signalState === 'green') { el.textContent = '信号灯：绿灯'; el.style.color = '#37e05a'; } else if (signalState === 'yellow') { el.textContent = '信号灯：黄灯'; el.style.color = '#ffcc00'; } else { el.textContent = '信号灯：红灯'; el.style.color = '#ff4444'; } }
}

function updateEnvironment(dt) {
  const spd = gameState === 'playing' ? speed : 0.3;
  const moveZ = spd * 60 * dt;
  groundLines.forEach(m => { m.position.z += moveZ; if (m.position.z > 15) m.position.z -= 7*46; });
  groundMarks.forEach(m => { m.position.z += moveZ; if (m.position.z > 20) m.position.z -= 560; });
  buildings.forEach(b => { b.position.z += moveZ; if (b.position.z > 90) b.position.z -= 380; });
  lampList.forEach(l => { l.position.z += moveZ; if (l.position.z > 60) l.position.z -= l.userData.period; });
  treeList.forEach(t => { t.position.z += moveZ; if (t.position.z > 60) t.position.z -= t.userData.period; });
  pedList.forEach(p => { p.position.z += moveZ; p.position.y = Math.abs(Math.sin(animTime*4 + p.userData.bob)) * 0.05; if (p.position.z > 60) p.position.z -= p.userData.period; });
  bikeList.forEach(b => { b.position.z += moveZ; if (b.position.z > 60) b.position.z -= b.userData.period; });
  signList.forEach(s => { s.position.z += moveZ; if (s.position.z > 60) s.position.z -= s.userData.period; });
  flowerList.forEach(f => { f.position.z += moveZ; if (f.position.z > 60) f.position.z -= f.userData.period; });
  paddyList.forEach(p => { p.position.z += moveZ; if (p.position.z > 90) p.position.z -= 560; });
  farHouseList.forEach(h => { h.position.z += moveZ; if (h.position.z > 90) h.position.z -= 560; });
  busStopList.forEach(b => { b.position.z += moveZ; if (b.position.z > 60) b.position.z -= b.userData.period; let conflict = false; for (let k=0; k<intersections.length; k++) if (Math.abs(b.position.z - intersections[k].position.z) < 10) { conflict = true; break; } if (!conflict) for (let k=0; k<uTurnZones.length; k++) if (Math.abs(b.position.z - uTurnZones[k].position.z) < 10) { conflict = true; break; } b.visible = !conflict; });
  medianList.forEach(seg => { seg.position.z += moveZ; if (seg.position.z > 30) seg.position.z -= MEDIAN_PERIOD; let hidden = false; for (let k=0; k<uTurnZones.length; k++) if (Math.abs(seg.position.z - uTurnZones[k].position.z) < 6.5) { hidden = true; break; } if (!hidden) for (let k=0; k<intersections.length; k++) if (Math.abs(seg.position.z - intersections[k].position.z) < 6.5) { hidden = true; break; } seg.visible = !hidden; });
  intersections.forEach(it => { const curZ = it.position.z + moveZ; if (it.userData.prevZ > 0.1 && curZ <= 0.1 && !it.userData.judged) { it.userData.judged = true; if (signalState === 'red') { score -= 100; showToast('闯红灯 -100', '#ff4444'); playBeep(90, 0.4, 'sawtooth'); const fl = document.getElementById('flash'); fl.style.background = '#ff2222'; fl.style.transition = 'none'; fl.style.opacity = '0.4'; setTimeout(()=>{ fl.style.transition='opacity 0.4s'; fl.style.opacity='0'; }, 90); } } it.userData.prevZ = curZ; it.position.z = curZ; if (it.position.z > 45) { it.position.z -= INTERSECTION_SPACING * INTERSECTION_COUNT; it.userData.judged = false; it.userData.prevZ = it.position.z; } });
  uTurnZones.forEach(u => { const curZ = u.position.z + moveZ; if (u.userData.prevZ > 0.1 && curZ <= 0.1 && !u.userData.judged) { u.userData.judged = true; if (speed > UTURN_MAX_SPEED) { score -= 50; showToast('掉头超速 -50', '#ff4444'); playBeep(90, 0.3, 'sawtooth'); } else if (speed > 0.05) { score += 30; showToast('掉头通过 +30', '#37e05a'); playBeep(660, 0.15, 'sine'); } } u.userData.prevZ = curZ; u.position.z = curZ; if (u.position.z > 45) { u.position.z -= UTURN_SPACING * UTURN_COUNT; u.userData.judged = false; u.userData.prevZ = u.position.z; } });
}

function updateRain(dt) {
  if (!rainLines || weather !== 'rainy') return;
  const arr = rainLines.geometry.attributes.position.array; const fast = gameState === 'playing' ? (1 + speed*1.3) : 1; const slant = -0.3 * fast;
  for (let i=0; i<rainDrops.length; i++) { const d = rainDrops[i]; d.y -= d.sp * dt * fast; if (d.y < 0) { d.y = 42 + Math.random()*8; d.x = (Math.random()-0.5)*60; d.z = (Math.random()-0.5)*110; } arr[i*6]=d.x; arr[i*6+1]=d.y; arr[i*6+2]=d.z; arr[i*6+3]=d.x + slant; arr[i*6+4]=d.y - 1.1; arr[i*6+5]=d.z; }
  rainLines.geometry.attributes.position.needsUpdate = true; rainLines.position.x = car.position.x * 0.8;
}

function gameOver(reason, detail) {
  if (gameState === 'menu') return;
  gameState = 'menu';
  if (engineGain) engineGain.gain.value = 0;
  playBeep(120, 0.5);
  const fl = document.getElementById('flash'); fl.style.background = '#ff2222'; fl.style.transition = 'none'; fl.style.opacity = '0.5';
  setTimeout(()=>{ fl.style.transition='opacity 0.5s'; fl.style.opacity='0'; }, 100);
  const overlay = document.getElementById('overlay'); overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1 style="color:#ff4d4d;">驾驶结束</h1>
    <h2 style="color:#ffb0b0;">${reason}</h2>
    <p>${detail || ''}</p>
    <p>本次得分：${Math.floor(score)} 分</p>
    <button id="restartBtn">再开一次</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
}
function restart() {
  aiCars.forEach(a => scene.remove(a)); aiCars = [];
  oncomingCars.forEach(a => scene.remove(a)); oncomingCars = [];
  score = 0; speed = 0; targetSpeed = 0;
  playerX = 1.75; targetX = 1.75; car.position.x = 1.75; car.rotation.z = 0; carGroup.visible = true;
  aiSpawnTimer = 20; oncomingTimer = 40; lightningTimer = 5; splashTimer = 0;
  camera.position.set(1.5, 5, 11);
  intersections.forEach(it => { it.userData.judged = false; }); uTurnZones.forEach(u => { u.userData.judged = false; });
  randomWeather();
  document.getElementById('score').textContent = '得分 0'; document.getElementById('speed').textContent = '速度 0 KM/H';
  document.getElementById('overlay').classList.add('hidden'); document.getElementById('ui').classList.remove('hidden');
  gameState = 'playing'; initAudio(); if (engineGain) engineGain.gain.value = 0.03;
}
function startGame() { document.getElementById('overlay').classList.add('hidden'); document.getElementById('ui').classList.remove('hidden'); gameState = 'playing'; initAudio(); }

init();
</script>
